<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zach's Construction | Hero</title>

  <style>
    :root {
      --black: #07090b;
      --black-2: #111418;
      --white: #ffffff;
      --muted: rgba(255, 255, 255, 0.72);
      --orange: #f05a18;
      --orange-dark: #c8460f;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--black);
      color: var(--white);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /*
      Image files needed in the same folder as this HTML:

      Blueprints/sketches:
      ChatGPT Image May 14, 2026, 09_12_52 PM.png

      Kitchen:
      ChatGPT Image May 14, 2026, 09_29_45 PM.png
    */

    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      height: 76px;
      background: rgba(7, 9, 11, 0.78);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .header-inner {
      width: min(1180px, calc(100% - 40px));
      height: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: max-content;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.04);
      clip-path: polygon(0 0, 82% 0, 100% 18%, 100% 100%, 0 100%);
    }

    .brand-mark::before {
      content: "";
      position: absolute;
      left: 10px;
      top: 7px;
      width: 7px;
      height: 28px;
      background: var(--orange);
      transform: skewX(-18deg);
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      left: 9px;
      bottom: 10px;
      width: 25px;
      height: 6px;
      background: var(--orange);
      transform: skewX(-18deg);
    }

    .brand-text strong {
      display: block;
      font-size: 18px;
      letter-spacing: -0.4px;
      line-height: 1.05;
      color: #fff;
    }

    .brand-text span {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.56);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 14px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.78);
    }

    .nav a {
      position: relative;
      padding: 28px 0;
    }

    .nav a::after {
      content: "";
      position: absolute;
      left: 0;
      right: 100%;
      bottom: 20px;
      height: 2px;
      background: var(--orange);
      transition: 0.2s ease;
    }

    .nav a:hover::after {
      right: 0;
    }

    .header-cta {
      height: 46px;
      padding: 0 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--orange);
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      box-shadow: 0 12px 24px rgba(240, 90, 24, 0.22);
      transition: 0.2s ease;
    }

    .header-cta:hover {
      background: var(--orange-dark);
      transform: translateY(-1px);
    }

    .hero {
      position: relative;
      min-height: calc(100vh - 76px);
      overflow: hidden;
      isolation: isolate;
      background:
        linear-gradient(90deg, rgba(7, 9, 11, 0.96) 0%, rgba(7, 9, 11, 0.88) 38%, rgba(7, 9, 11, 0.70) 57%, rgba(7, 9, 11, 0.08) 100%),
        url("ChatGPT Image May 14, 2026, 09_12_52 PM.png") center center / cover no-repeat;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -3;
      background: url("ChatGPT Image May 14, 2026, 09_12_52 PM.png") center center / cover no-repeat;
      filter: grayscale(100%) contrast(1.15);
      opacity: 0.55;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(circle at 18% 48%, rgba(240, 90, 24, 0.10), transparent 28%),
        linear-gradient(90deg, rgba(7, 9, 11, 0.94) 0%, rgba(7, 9, 11, 0.87) 35%, rgba(7, 9, 11, 0.55) 57%, rgba(7, 9, 11, 0.08) 100%);
      pointer-events: none;
    }

    .kitchen-reveal {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 64%;
      z-index: -1;
      background: url("ChatGPT Image May 14, 2026, 09_29_45 PM.png") center center / cover no-repeat;
      clip-path: ellipse(86% 98% at 84% 50%);
    }

    .kitchen-reveal::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(7, 9, 11, 0.50) 0%, rgba(7, 9, 11, 0.16) 18%, rgba(7, 9, 11, 0.00) 44%),
        linear-gradient(to bottom, rgba(255,255,255,0.04), rgba(0,0,0,0.16));
    }

    .kitchen-reveal::after {
      content: "";
      position: absolute;
      top: -8%;
      bottom: -8%;
      left: -2px;
      width: 42%;
      background: rgba(7, 9, 11, 0.34);
      clip-path: ellipse(58% 59% at 0% 50%);
      pointer-events: none;
    }

    .orange-edge {
      position: absolute;
      top: 0;
      right: 58.5%;
      width: 3px;
      height: 100%;
      z-index: 1;
      background: linear-gradient(to bottom, transparent 0%, rgba(240, 90, 24, 0.82) 18%, rgba(240, 90, 24, 0.82) 82%, transparent 100%);
      transform: rotate(8deg);
      transform-origin: center;
      opacity: 0.68;
    }

    .hero-inner {
      position: relative;
      z-index: 2;
      width: min(1180px, calc(100% - 40px));
      min-height: calc(100vh - 76px);
      margin: 0 auto;
      display: flex;
      align-items: center;
      padding: 72px 0 86px;
    }

    .hero-copy {
      max-width: 590px;
      padding-top: 8px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 12px;
      line-height: 1.2;
      letter-spacing: 1.35px;
      text-transform: uppercase;
      font-weight: 900;
    }

    .eyebrow::before {
      content: "";
      width: 38px;
      height: 4px;
      background: var(--orange);
      transform: skewX(-18deg);
      flex: 0 0 auto;
    }

    h1 {
      max-width: 660px;
      font-size: clamp(54px, 5.2vw, 84px);
      line-height: 1.02;
      letter-spacing: -3.1px;
      font-weight: 650;
      color: #fff;
      margin-bottom: 22px;
      text-shadow: 0 20px 45px rgba(0, 0, 0, 0.28);
    }

    h1 .accent {
      color: var(--orange);
      position: relative;
      display: inline-block;
    }

    h1 .accent::after {
      content: "";
      position: absolute;
      left: 2px;
      right: -10px;
      bottom: -7px;
      height: 2px;
      background: var(--orange);
      transform: skewX(-18deg);
    }

    .subheadline {
      max-width: 555px;
      font-size: 18px;
      line-height: 1.65;
      color: var(--muted);
      margin-bottom: 34px;
    }

    .quote-btn {
      position: relative;
      min-width: 200px;
      height: 60px;
      padding: 0 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--orange);
      color: #fff;
      font-size: 15px;
      font-weight: 900;
      transition: 0.2s ease;
      box-shadow: 0 18px 35px rgba(240, 90, 24, 0.24);
    }

    .quote-btn::before,
    .quote-btn::after {
      content: "";
      position: absolute;
      top: -8px;
      bottom: -8px;
      width: 1px;
      background: rgba(240, 90, 24, 0.58);
    }

    .quote-btn::before {
      left: 8px;
    }

    .quote-btn::after {
      right: 8px;
    }

    .quote-btn span::before,
    .quote-btn span::after {
      content: "";
      position: absolute;
      left: -8px;
      right: -8px;
      height: 1px;
      background: rgba(240, 90, 24, 0.58);
    }

    .quote-btn span::before {
      top: 8px;
    }

    .quote-btn span::after {
      bottom: 8px;
    }

    .quote-btn:hover {
      background: var(--orange-dark);
      transform: translateY(-2px);
    }

    @media (max-width: 1080px) {
      .nav {
        display: none;
      }

      .kitchen-reveal {
        width: 70%;
        clip-path: ellipse(88% 95% at 86% 50%);
        opacity: 0.86;
      }

      .hero-copy {
        max-width: 560px;
      }
    }

    @media (max-width: 820px) {
      .site-header {
        height: 72px;
      }

      .header-inner,
      .hero-inner {
        width: min(100% - 32px, 1180px);
      }

      .brand-text span,
      .header-cta {
        display: none;
      }

      .hero {
        min-height: auto;
        background:
          linear-gradient(180deg, rgba(7, 9, 11, 0.92) 0%, rgba(7, 9, 11, 0.82) 54%, rgba(7, 9, 11, 0.92) 100%),
          url("ChatGPT Image May 14, 2026, 09_12_52 PM.png") center center / cover no-repeat;
      }

      .hero-inner {
        min-height: auto;
        align-items: flex-start;
        padding: 62px 0 360px;
      }

      .kitchen-reveal {
        top: auto;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 360px;
        clip-path: ellipse(80% 68% at 50% 100%);
        opacity: 1;
      }

      .kitchen-reveal::before {
        background:
          linear-gradient(to bottom, rgba(7, 9, 11, 0.48), rgba(7, 9, 11, 0.05) 38%, rgba(7, 9, 11, 0.02));
      }

      .kitchen-reveal::after,
      .orange-edge {
        display: none;
      }

      h1 {
        font-size: clamp(43px, 12vw, 62px);
        letter-spacing: -2px;
      }

      .subheadline {
        font-size: 16px;
      }
    }

    @media (max-width: 520px) {
      .brand-text strong {
        font-size: 16px;
      }

      .brand-mark {
        width: 38px;
        height: 38px;
      }

      .quote-btn {
        width: 100%;
      }

      .hero-inner {
        padding-bottom: 320px;
      }

      .kitchen-reveal {
        height: 320px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="#" class="brand" aria-label="Zach's Construction home">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-text">
          <strong>Zach's Construction</strong>
          <span>Construction & Property Work</span>
        </div>
      </a>

      <nav class="nav" aria-label="Main navigation">
        <a href="#services">Services</a>
        <a href="#work">Work</a>
        <a href="#about">About</a>
        <a href="#quote">Contact</a>
      </nav>

      <a href="#quote" class="header-cta">Free Quote</a>
    </div>
  </header>

  <section class="hero">
    <div class="kitchen-reveal"></div>
    <div class="orange-edge"></div>

    <div class="hero-inner">
      <div class="hero-copy">
        <div class="eyebrow">Quality Work. Fair Price. Zero Cut Corners.</div>

        <h1>
          The Last Contractor <span class="accent">You’ll Ever Need</span>
        </h1>

        <p class="subheadline">
          Reliable construction, repairs, remodels, and property work done right without overcharging.
        </p>

        <a href="#quote" class="quote-btn"><span>Get a Free Quote</span></a>
      </div>
    </div>
  </section>
</body>
</html>
