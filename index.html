<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zach Hero Image Test</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
      overflow: hidden;
    }

    /*
      Put these two files in the same folder as this HTML:
      - ChatGPT Image May 14, 2026, 09_12_52 PM.png   (blueprints)
      - ChatGPT Image May 14, 2026, 09_29_45 PM.png   (kitchen)
    */

    .hero-image-only {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: url("ChatGPT Image May 14, 2026, 09_12_52 PM.png") center center / cover no-repeat;
    }

    /* keep the blueprint image visible with no heavy dimming */
    .hero-image-only::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 18% 50%, rgba(255,255,255,0.04), transparent 32%),
        linear-gradient(90deg, rgba(255,255,255,0.00) 0%, rgba(255,255,255,0.00) 100%);
      pointer-events: none;
    }

    .kitchen-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .kitchen-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
    }

    /* subtle depth on the inside edge only, not dimming the whole section */
    .edge-shade {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg,
          rgba(0,0,0,0.14) 0%,
          rgba(0,0,0,0.06) 8%,
          rgba(0,0,0,0.00) 18%);
      mix-blend-mode: multiply;
    }

    /* thin orange accent following the split */
    .accent-stroke {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .accent-stroke path {
      fill: none;
      stroke: #f05a18;
      stroke-width: 4;
      opacity: 0.92;
      filter: drop-shadow(0 0 8px rgba(240, 90, 24, 0.18));
    }

    /*
      Mobile: still keep the hero visual only, but make the curve easier to read.
    */
    @media (max-width: 900px) {
      .accent-stroke path {
        stroke-width: 3;
      }
    }
  </style>
</head>
<body>

  <section class="hero-image-only">

    <!-- kitchen clipped into a swervy half-and-half shape -->
    <svg class="kitchen-layer" viewBox="0 0 1440 900" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <!-- More detailed, swervy split near the middle -->
        <clipPath id="kitchenClip" clipPathUnits="objectBoundingBox">
          <path d="
            M 0.53 0
            C 0.49 0.05, 0.47 0.10, 0.46 0.16
            C 0.45 0.23, 0.47 0.30, 0.49 0.36
            C 0.52 0.44, 0.52 0.52, 0.49 0.60
            C 0.46 0.68, 0.45 0.76, 0.47 0.84
            C 0.49 0.91, 0.53 0.96, 0.58 1
            L 1 1
            L 1 0
            Z
          " />
        </clipPath>
      </defs>

      <image
        href="ChatGPT Image May 14, 2026, 09_29_45 PM.png"
        x="0"
        y="0"
        width="1440"
        height="900"
        preserveAspectRatio="xMidYMid slice"
        clip-path="url(#kitchenClip)"
      ></image>

      <image
        href="ChatGPT Image May 14, 2026, 09_29_45 PM.png"
        x="0"
        y="0"
        width="1440"
        height="900"
        preserveAspectRatio="xMidYMid slice"
        clip-path="url(#kitchenClip)"
        opacity="0"
      ></image>

      <!-- slight inside-edge shading only on the kitchen side -->
      <path d="
        M 763 0
        C 706 48, 678 96, 662 146
        C 650 208, 671 272, 704 325
        C 748 396, 750 469, 711 540
        C 676 615, 667 697, 696 778
        C 719 842, 765 883, 835 900
        L 890 900
        C 810 874, 760 836, 730 772
        C 697 701, 704 620, 742 550
        C 785 474, 784 392, 737 316
        C 699 255, 683 200, 694 147
        C 706 93, 734 44, 782 0
        Z
      " fill="rgba(0,0,0,0.10)"></path>
    </svg>

    <!-- orange stroke overlay that follows the curve -->
    <svg class="accent-stroke" viewBox="0 0 1440 900" preserveAspectRatio="none" aria-hidden="true">
      <path d="
        M 763 0
        C 706 48, 678 96, 662 146
        C 650 208, 671 272, 704 325
        C 748 396, 750 469, 711 540
        C 676 615, 667 697, 696 778
        C 719 842, 765 883, 835 900
      " />
    </svg>

  </section>

</body>
</html>
