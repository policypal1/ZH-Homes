<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zach's Construction | Hero</title>

  <style>
    :root {
      --black: #111418;
      --black-soft: #1d2329;
      --white: #ffffff;
      --off-white: #f7f6f2;
      --gray: #626b74;
      --orange: #f05a18;
      --orange-dark: #c8450f;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--black);
      color: var(--black);
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      height: 76px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(17, 20, 24, 0.08);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.06);
    }

    .header-inner {
      width: min(1180px, calc(100% - 40px));
      height: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: max-content;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      background: var(--black);
      position: relative;
      clip-path: polygon(0 0, 82% 0, 100% 18%, 100% 100%, 0 100%);
    }

    .brand-mark::before {
      content: "";
      position: absolute;
      left: 10px;
      top: 7px;
      width: 7px;
      height: 28px;
      background: var(--orange);
      transform: skewX(-18deg);
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      left: 9px;
      bottom: 10px;
      width: 25px;
      height: 6px;
      background: var(--orange);
      transform: skewX(-18deg);
    }

    .brand-text strong {
      display: block;
      font-size: 18px;
      letter-spacing: -0.4px;
      line-height: 1.05;
    }

    .brand-text span {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--gray);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 14px;
      font-weight: 800;
      color: #2c333a;
    }

    .nav a {
      position: relative;
      padding: 28px 0;
    }

    .nav a::after {
      content: "";
      position: absolute;
      left: 0;
      right: 100%;
      bottom: 20px;
      height: 2px;
      background: var(--orange);
      transition: 0.2s ease;
    }

    .nav a:hover::after {
      right: 0;
    }

    .header-cta {
      height: 46px;
      padding: 0 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--orange);
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      box-shadow: 0 12px 24px rgba(240, 90, 24, 0.24);
      transition: 0.2s ease;
    }

    .header-cta:hover {
      background: var(--orange-dark);
      transform: translateY(-1px);
    }

    .hero {
      position: relative;
      min-height: calc(100vh - 76px);
      overflow: hidden;
      background: var(--off-white);
      isolation: isolate;
    }

    /*
      Put these files in the same folder as this HTML:
      - ChatGPT Image May 14, 2026, 09_12_52 PM.png  (blueprints)
      - ChatGPT Image May 14, 2026, 09_29_45 PM.png  (kitchen)
    */
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -3;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.90) 0%, rgba(255,255,255,0.82) 35%, rgba(255,255,255,0.58) 58%, rgba(255,255,255,0.40) 100%),
        url("ChatGPT Image May 14, 2026, 09_12_52 PM.png") center center / cover no-repeat;
      filter: grayscale(100%) contrast(1.05);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(circle at 78% 38%, rgba(240, 90, 24, 0.12), transparent 22%),
        radial-gradient(circle at 72% 75%, rgba(240, 90, 24, 0.08), transparent 18%);
      pointer-events: none;
    }

    .hero-inner {
      width: min(1180px, calc(100% - 40px));
      min-height: calc(100vh - 76px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.02fr 0.98fr;
      align-items: center;
      gap: 44px;
      padding: 70px 0 86px;
      position: relative;
      z-index: 2;
    }

    .hero-copy {
      max-width: 560px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      color: #343a40;
      font-size: 12px;
      line-height: 1.2;
      letter-spacing: 1.35px;
      text-transform: uppercase;
      font-weight: 900;
    }

    .eyebrow::before {
      content: "";
      width: 38px;
      height: 4px;
      background: var(--orange);
      transform: skewX(-18deg);
      flex: 0 0 auto;
    }

    h1 {
      max-width: 660px;
      font-size: clamp(54px, 5.2vw, 84px);
      line-height: 1.02;
      letter-spacing: -3.1px;
      font-weight: 600;
      color: var(--black);
      margin-bottom: 22px;
    }

    h1 .accent {
      color: var(--orange);
      position: relative;
      display: inline-block;
    }

    h1 .accent::after {
      content: "";
      position: absolute;
      left: 2px;
      right: -10px;
      bottom: -7px;
      height: 2px;
      background: var(--orange);
      transform: skewX(-18deg);
    }

    .subheadline {
      max-width: 560px;
      font-size: 18px;
      line-height: 1.65;
      color: var(--gray);
      margin-bottom: 34px;
    }

    .quote-btn {
      position: relative;
      min-width: 200px;
      height: 60px;
      padding: 0 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--black);
      color: #fff;
      font-size: 15px;
      font-weight: 900;
      transition: 0.2s ease;
    }

    .quote-btn::before,
    .quote-btn::after {
      content: "";
      position: absolute;
      top: -8px;
      bottom: -8px;
      width: 1px;
      background: rgba(16, 19, 23, 0.42);
    }

    .quote-btn::before {
      left: 8px;
    }

    .quote-btn::after {
      right: 8px;
    }

    .quote-btn span::before,
    .quote-btn span::after {
      content: "";
      position: absolute;
      left: -8px;
      right: -8px;
      height: 1px;
      background: rgba(16, 19, 23, 0.42);
    }

    .quote-btn span::before {
      top: 8px;
    }

    .quote-btn span::after {
      bottom: 8px;
    }

    .quote-btn:hover {
      background: var(--black-soft);
      transform: translateY(-2px);
    }

    .hero-visual {
      position: relative;
      min-height: 560px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bubble-accent-1,
    .bubble-accent-2 {
      position: absolute;
      border-radius: 50%;
      background: var(--orange);
      filter: blur(0px);
      opacity: 0.95;
    }

    .bubble-accent-1 {
      width: 78px;
      height: 78px;
      top: 34px;
      right: 34px;
      opacity: 0.12;
    }

    .bubble-accent-2 {
      width: 24px;
      height: 24px;
      bottom: 58px;
      left: 42px;
      opacity: 0.78;
    }

    .kitchen-bubble-wrap {
      position: relative;
      width: min(520px, 100%);
      aspect-ratio: 1 / 1.04;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .kitchen-bubble-outline {
      position: absolute;
      inset: 18px;
      border: 2px solid rgba(240, 90, 24, 0.55);
      border-radius: 56% 44% 50% 50% / 43% 56% 44% 57%;
      transform: rotate(-6deg);
    }

    .kitchen-bubble {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 60% 40% 54% 46% / 44% 58% 42% 56%;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.18);
      transform: rotate(-3deg);
      background:
        url("ChatGPT Image May 14, 2026, 09_29_45 PM.png") center center / cover no-repeat,
        #ddd;
    }

    .kitchen-bubble::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(255,255,255,0.04), rgba(0,0,0,0.14));
    }

    .kitchen-bubble::after {
      content: "";
      position: absolute;
      inset: 16px;
      border-radius: 58% 42% 50% 50% / 44% 56% 44% 56%;
      border: 1px solid rgba(255, 255, 255, 0.42);
      pointer-events: none;
    }

    @media (max-width: 1080px) {
      .nav {
        display: none;
      }

      .hero-inner {
        grid-template-columns: 1fr;
        gap: 34px;
        padding-top: 68px;
      }

      .hero-copy {
        max-width: 100%;
      }

      .hero-visual {
        min-height: 0;
        justify-content: flex-start;
      }

      .kitchen-bubble-wrap {
        width: min(520px, 100%);
      }
    }

    @media (max-width: 820px) {
      .site-header {
        height: 72px;
      }

      .header-inner,
      .hero-inner {
        width: min(100% - 32px, 1180px);
      }

      .brand-text span,
      .header-cta {
        display: none;
      }

      .hero {
        min-height: auto;
      }

      .hero::before {
        background:
          linear-gradient(180deg, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.82) 40%, rgba(255,255,255,0.72) 100%),
          url("ChatGPT Image May 14, 2026, 09_12_52 PM.png") center center / cover no-repeat;
      }

      .hero-inner {
        min-height: auto;
        padding: 64px 0 72px;
      }

      h1 {
        font-size: clamp(43px, 12vw, 62px);
        letter-spacing: -2px;
      }

      .subheadline {
        font-size: 16px;
      }

      .hero-visual {
        justify-content: center;
      }

      .kitchen-bubble-wrap {
        width: min(460px, 100%);
      }
    }

    @media (max-width: 520px) {
      .brand-text strong {
        font-size: 16px;
      }

      .brand-mark {
        width: 38px;
        height: 38px;
      }

      .quote-btn {
        width: 100%;
      }

      .hero-visual {
        min-height: 0;
      }

      .bubble-accent-1 {
        width: 56px;
        height: 56px;
        top: 8px;
        right: 10px;
      }

      .bubble-accent-2 {
        left: 8px;
        bottom: 18px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="#" class="brand" aria-label="Zach's Construction home">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-text">
          <strong>Zach's Construction</strong>
          <span>Construction & Property Work</span>
        </div>
      </a>

      <nav class="nav" aria-label="Main navigation">
        <a href="#services">Services</a>
        <a href="#work">Work</a>
        <a href="#about">About</a>
        <a href="#quote">Contact</a>
      </nav>

      <a href="#quote" class="header-cta">Free Quote</a>
    </div>
  </header>

  <section class="hero">
    <div class="hero-inner">
      <div class="hero-copy">
        <div class="eyebrow">Quality Work. Fair Price. Zero Cut Corners.</div>

        <h1>
          The Last Contractor <span class="accent">You’ll Ever Need</span>
        </h1>

        <p class="subheadline">
          Reliable construction, repairs, remodels, and property work done right without overcharging.
        </p>

        <a href="#quote" class="quote-btn"><span>Get a Free Quote</span></a>
      </div>

      <div class="hero-visual">
        <div class="bubble-accent-1"></div>
        <div class="bubble-accent-2"></div>

        <div class="kitchen-bubble-wrap">
          <div class="kitchen-bubble-outline"></div>
          <div class="kitchen-bubble"></div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
