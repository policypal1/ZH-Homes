<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zach's Construction | Hero</title>

  <style>
    :root {
      --black: #101317;
      --black-soft: #1d2329;
      --white: #ffffff;
      --panel: rgba(246, 246, 242, 0.92);
      --gray: #5f6872;
      --orange: #f05a18;
      --orange-dark: #c4470e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--black);
      color: var(--black);
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      height: 76px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(16, 19, 23, 0.08);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.06);
    }

    .header-inner {
      width: min(1180px, calc(100% - 40px));
      height: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: max-content;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      background: var(--black);
      position: relative;
      clip-path: polygon(0 0, 82% 0, 100% 18%, 100% 100%, 0 100%);
    }

    .brand-mark::before {
      content: "";
      position: absolute;
      left: 10px;
      top: 7px;
      width: 7px;
      height: 28px;
      background: var(--orange);
      transform: skewX(-18deg);
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      left: 9px;
      bottom: 10px;
      width: 25px;
      height: 6px;
      background: var(--orange);
      transform: skewX(-18deg);
    }

    .brand-text {
      line-height: 1.05;
    }

    .brand-text strong {
      display: block;
      font-size: 18px;
      letter-spacing: -0.4px;
    }

    .brand-text span {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--gray);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 14px;
      font-weight: 800;
      color: #2c333a;
    }

    .nav a {
      position: relative;
      padding: 28px 0;
    }

    .nav a::after {
      content: "";
      position: absolute;
      left: 0;
      right: 100%;
      bottom: 20px;
      height: 2px;
      background: var(--orange);
      transition: 0.2s ease;
    }

    .nav a:hover::after {
      right: 0;
    }

    .header-cta {
      height: 46px;
      padding: 0 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--orange);
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      box-shadow: 0 12px 24px rgba(240, 90, 24, 0.24);
      transition: 0.2s ease;
    }

    .header-cta:hover {
      background: var(--orange-dark);
      transform: translateY(-1px);
    }

    .hero {
      position: relative;
      min-height: calc(100vh - 76px);
      overflow: hidden;
      background: #d9dddf;
    }

    /*
      Put this file in the same folder as this HTML:
      ChatGPT Image May 14, 2026, 09_07_21 PM.png
    */
    .hero-bg {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(to right, rgba(244,244,240,0.20), rgba(244,244,240,0.00) 47%, rgba(0,0,0,0.07)),
        url("ChatGPT Image May 14, 2026, 09_07_21 PM.png") center right / cover no-repeat,
        linear-gradient(135deg, #f1f1ee 0%, #c5cbd0 45%, #7f8a92 100%);
    }

    .hero-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(255,255,255,0.04), rgba(0,0,0,0.13)),
        linear-gradient(to right, rgba(255,255,255,0.10), rgba(255,255,255,0) 52%);
    }

    .white-cut {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: var(--panel);
      clip-path: polygon(0 0, 50% 0, 77.5% 100%, 0 100%);
    }

    .white-cut::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right, rgba(255,255,255,0.86), rgba(255,255,255,0.20)),
        url("ChatGPT Image May 14, 2026, 09_07_21 PM.png") center right / cover no-repeat;
      opacity: 0.13;
      filter: grayscale(100%);
    }

    .black-slice {
      position: absolute;
      inset: 0;
      z-index: 3;
      background: var(--black);
      clip-path: polygon(49.2% 0, 50.35% 0, 78% 100%, 76.85% 100%);
    }

    .orange-slice {
      position: absolute;
      inset: 0;
      z-index: 4;
      background: var(--orange);
      clip-path: polygon(73.1% 71%, 74.6% 71%, 80.15% 100%, 78.55% 100%);
      box-shadow: 0 0 35px rgba(240, 90, 24, 0.28);
    }

    .top-orange-line {
      position: absolute;
      top: 0;
      left: 38%;
      width: 120px;
      height: 4px;
      background: var(--orange);
      z-index: 5;
    }

    .hero-inner {
      position: relative;
      z-index: 8;
      width: min(1180px, calc(100% - 40px));
      min-height: calc(100vh - 76px);
      margin: 0 auto;
      display: flex;
      align-items: center;
      padding: 70px 0 82px;
    }

    .hero-copy {
      width: min(560px, 45vw);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      color: #343a40;
      font-size: 12px;
      line-height: 1.2;
      letter-spacing: 1.35px;
      text-transform: uppercase;
      font-weight: 900;
    }

    .eyebrow::before {
      content: "";
      width: 38px;
      height: 4px;
      background: var(--orange);
      transform: skewX(-18deg);
      flex: 0 0 auto;
    }

    h1 {
      max-width: 650px;
      font-size: clamp(54px, 5.3vw, 86px);
      line-height: 1.02;
      letter-spacing: -3.2px;
      font-weight: 600;
      color: var(--black);
      margin-bottom: 24px;
    }

    h1 .accent {
      color: var(--orange);
      position: relative;
      display: inline-block;
    }

    h1 .accent::after {
      content: "";
      position: absolute;
      left: 2px;
      right: -10px;
      bottom: -7px;
      height: 2px;
      background: var(--orange);
      transform: skewX(-18deg);
    }

    .subheadline {
      max-width: 570px;
      font-size: 18px;
      line-height: 1.65;
      color: var(--gray);
      margin-bottom: 34px;
    }

    .quote-btn {
      position: relative;
      min-width: 200px;
      height: 60px;
      padding: 0 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--black);
      color: #fff;
      font-size: 15px;
      font-weight: 900;
      transition: 0.2s ease;
    }

    .quote-btn::before,
    .quote-btn::after {
      content: "";
      position: absolute;
      top: -8px;
      bottom: -8px;
      width: 1px;
      background: rgba(16, 19, 23, 0.42);
    }

    .quote-btn::before {
      left: 8px;
    }

    .quote-btn::after {
      right: 8px;
    }

    .quote-btn span::before,
    .quote-btn span::after {
      content: "";
      position: absolute;
      left: -8px;
      right: -8px;
      height: 1px;
      background: rgba(16, 19, 23, 0.42);
    }

    .quote-btn span::before {
      top: 8px;
    }

    .quote-btn span::after {
      bottom: 8px;
    }

    .quote-btn:hover {
      background: var(--black-soft);
      transform: translateY(-2px);
    }

    @media (max-width: 1080px) {
      .nav {
        display: none;
      }

      .hero-copy {
        width: min(570px, 55vw);
      }

      .white-cut {
        clip-path: polygon(0 0, 58% 0, 88% 100%, 0 100%);
      }

      .black-slice {
        clip-path: polygon(57.1% 0, 58.3% 0, 88.3% 100%, 87.1% 100%);
      }

      .orange-slice {
        clip-path: polygon(81% 71%, 82.55% 71%, 88.5% 100%, 86.8% 100%);
      }
    }

    @media (max-width: 820px) {
      .site-header {
        height: 72px;
      }

      .header-inner,
      .hero-inner {
        width: min(100% - 32px, 1180px);
      }

      .brand-text span {
        display: none;
      }

      .header-cta {
        display: none;
      }

      .hero {
        min-height: auto;
      }

      .hero-bg {
        background-position: center;
      }

      .hero-bg::after {
        background: rgba(0,0,0,0.20);
      }

      .white-cut {
        background: rgba(246, 246, 242, 0.94);
        clip-path: polygon(0 0, 100% 0, 100% 76%, 0 100%);
      }

      .white-cut::before {
        opacity: 0.10;
      }

      .black-slice {
        clip-path: polygon(0 75%, 100% 63%, 100% 65.5%, 0 77.5%);
      }

      .orange-slice {
        clip-path: polygon(0 94%, 100% 80%, 100% 86%, 0 100%);
      }

      .top-orange-line {
        left: 32px;
      }

      .hero-inner {
        min-height: auto;
        align-items: flex-start;
        padding: 76px 0 190px;
      }

      .hero-copy {
        width: 100%;
      }

      h1 {
        font-size: clamp(44px, 12vw, 64px);
        letter-spacing: -2px;
      }

      .subheadline {
        font-size: 16px;
      }
    }

    @media (max-width: 520px) {
      .brand-text strong {
        font-size: 16px;
      }

      .brand-mark {
        width: 38px;
        height: 38px;
      }

      .quote-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="#" class="brand" aria-label="Zach's Construction home">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-text">
          <strong>Zach's Construction</strong>
          <span>Construction & Property Work</span>
        </div>
      </a>

      <nav class="nav" aria-label="Main navigation">
        <a href="#services">Services</a>
        <a href="#work">Work</a>
        <a href="#about">About</a>
        <a href="#quote">Contact</a>
      </nav>

      <a href="#quote" class="header-cta">Free Quote</a>
    </div>
  </header>

  <section class="hero">
    <div class="hero-bg"></div>
    <div class="white-cut"></div>
    <div class="black-slice"></div>
    <div class="orange-slice"></div>
    <div class="top-orange-line"></div>

    <div class="hero-inner">
      <div class="hero-copy">
        <div class="eyebrow">Quality Work. Fair Price. Zero Cut Corners.</div>

        <h1>
          The Last Contractor <span class="accent">You’ll Ever Need</span>
        </h1>

        <p class="subheadline">
          Reliable construction, repairs, remodels, and property work done right without overcharging.
        </p>

        <a href="#quote" class="quote-btn"><span>Get a Free Quote</span></a>
      </div>
    </div>
  </section>
</body>
</html>
