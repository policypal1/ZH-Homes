<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zach's Construction | Hero Section</title>

  <style>
    :root {
      --dark: #1d2227;
      --text: #23272d;
      --muted: #6d747c;
      --white-panel: rgba(246, 246, 244, 0.91);
      --line: #171c21;
      --soft-line: rgba(29, 34, 39, 0.32);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: var(--text);
    }

    .hero {
      position: relative;
      min-height: 100vh;
      width: 100%;
      overflow: hidden;
      background: #d8dde0;
    }

    /*
      Replace zach-hero.jpg with Zach's real project/jobsite photo.
      Best photo type: exterior remodel, construction project, roofline, tools, truck, or before/after work.
    */
    .hero-bg {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right, rgba(230, 233, 234, 0.25) 0%, rgba(230, 233, 234, 0.02) 46%, rgba(0, 0, 0, 0.08) 100%),
        url("zach-hero.jpg") center right / cover no-repeat,
        linear-gradient(135deg, #dfe4e6 0%, #b8c0c4 42%, #7f8b91 100%);
      z-index: 1;
      filter: grayscale(100%);
    }

    .hero-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right, rgba(255,255,255,0.12), rgba(255,255,255,0) 52%),
        linear-gradient(to bottom, rgba(255,255,255,0.08), rgba(0,0,0,0.08));
    }

    /* Main white angled overlay, shaped like the reference layout */
    .white-cut {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: var(--white-panel);
      clip-path: polygon(0 0, 50.2% 0, 78.5% 100%, 0 100%);
    }

    /* Faint background image inside the white panel */
    .white-cut::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right, rgba(255,255,255,0.72), rgba(255,255,255,0.28)),
        url("zach-hero.jpg") center right / cover no-repeat;
      opacity: 0.16;
      filter: grayscale(100%);
    }

    /* Dark diagonal cut line from the reference */
    .black-cut-line {
      position: absolute;
      inset: 0;
      z-index: 3;
      background: var(--line);
      clip-path: polygon(49.55% 0, 50.55% 0, 78.75% 100%, 77.75% 100%);
    }

    /* Subtle lower diagonal strip, black/gray only */
    .lower-cut-line {
      position: absolute;
      inset: 0;
      z-index: 4;
      background: #20252a;
      clip-path: polygon(73.75% 73%, 75.15% 73%, 80.6% 100%, 79.1% 100%);
    }

    .top-accent {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      z-index: 10;
      background: linear-gradient(to right, transparent 0%, transparent 38%, #111 38%, #111 48%, transparent 48%);
    }

    .hero-content {
      position: relative;
      z-index: 6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 80px 8% 96px;
    }

    .hero-copy {
      width: min(520px, 42vw);
      margin-left: 8%;
      margin-top: -10px;
    }

    .mini-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 26px;
    }

    .mark {
      position: relative;
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
    }

    .mark::before {
      content: "";
      position: absolute;
      inset: 3px;
      background:
        linear-gradient(#111, #111) 12px 0 / 4px 100% no-repeat,
        linear-gradient(#111, #111) 0 36px / 100% 4px no-repeat;
    }

    .mark::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(to right, var(--soft-line) 0 1px, transparent 1px 12px),
        repeating-linear-gradient(to bottom, var(--soft-line) 0 1px, transparent 1px 12px);
      clip-path: polygon(0 18%, 82% 18%, 82% 100%, 0 100%);
    }

    .mini-brand span {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.1px;
      font-weight: 700;
      color: #3d4248;
      white-space: nowrap;
    }

    h1 {
      font-size: clamp(52px, 4.9vw, 82px);
      line-height: 1.06;
      letter-spacing: -2.5px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 24px;
    }

    h1 .accent {
      color: #111;
      position: relative;
      display: inline-block;
      font-weight: 700;
    }

    h1 .accent::after {
      content: "";
      position: absolute;
      left: 0;
      right: -8px;
      bottom: -7px;
      height: 2px;
      background: #111;
      transform: skewX(-18deg);
      opacity: 0.85;
    }

    .hero-text {
      max-width: 650px;
      font-size: 17px;
      line-height: 1.65;
      color: var(--muted);
      margin-bottom: 34px;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 0;
    }

    .btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 190px;
      height: 58px;
      padding: 0 28px;
      background: var(--dark);
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .btn::before,
    .btn::after {
      content: "";
      position: absolute;
      top: -8px;
      bottom: -8px;
      width: 1px;
      background: rgba(29,34,39,0.45);
    }

    .btn::before {
      left: 8px;
    }

    .btn::after {
      right: 8px;
    }

    .btn span::before,
    .btn span::after {
      content: "";
      position: absolute;
      left: -8px;
      right: -8px;
      height: 1px;
      background: rgba(29,34,39,0.45);
    }

    .btn span::before {
      top: 8px;
    }

    .btn span::after {
      bottom: 8px;
    }

    .btn:hover {
      background: #30363d;
      transform: translateY(-2px);
    }

    .slider-dots {
      position: absolute;
      left: calc(16% + 8px);
      bottom: 48px;
      z-index: 7;
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .slider-dots span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #111;
      opacity: 0.9;
    }

    .slider-dots span:first-child {
      width: 15px;
      height: 15px;
    }

    @media (max-width: 1200px) {
      .hero-copy {
        margin-left: 3%;
        width: min(520px, 48vw);
      }

      h1 {
        font-size: clamp(48px, 5vw, 72px);
      }

      .white-cut {
        clip-path: polygon(0 0, 56% 0, 86% 100%, 0 100%);
      }

      .black-cut-line {
        clip-path: polygon(55.4% 0, 56.6% 0, 86.3% 100%, 85.1% 100%);
      }

      .lower-cut-line {
        clip-path: polygon(80.5% 74%, 82.1% 74%, 87.4% 100%, 85.8% 100%);
      }
    }

    @media (max-width: 820px) {
      .hero {
        min-height: auto;
      }

      .hero-bg {
        background-position: center;
      }

      .hero-bg::after {
        background: rgba(0,0,0,0.22);
      }

      .white-cut {
        background: rgba(246,246,244,0.94);
        clip-path: polygon(0 0, 100% 0, 100% 78%, 0 100%);
      }

      .white-cut::before {
        opacity: 0.12;
      }

      .black-cut-line {
        clip-path: polygon(0 77%, 100% 65%, 100% 67%, 0 79%);
      }

      .lower-cut-line {
        clip-path: polygon(0 96%, 100% 82%, 100% 88%, 0 100%);
      }

      .hero-content {
        min-height: auto;
        padding: 105px 24px 170px;
        align-items: flex-start;
      }

      .hero-copy {
        width: 100%;
        margin-left: 0;
      }

      h1 {
        font-size: clamp(43px, 12vw, 62px);
        letter-spacing: -1.8px;
      }

      .hero-text {
        font-size: 16px;
        max-width: 100%;
      }

      .slider-dots {
        left: 24px;
        bottom: 36px;
      }
    }

    @media (max-width: 480px) {
      .mini-brand span {
        font-size: 10px;
      }

      .mark {
        width: 46px;
        height: 46px;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <section class="hero">
    <div class="top-accent"></div>

    <div class="hero-bg"></div>
    <div class="white-cut"></div>
    <div class="black-cut-line"></div>
    <div class="lower-cut-line"></div>

    <div class="hero-content">
      <div class="hero-copy">
        <div class="mini-brand">
          <div class="mark" aria-hidden="true"></div>
          <span>The Last Contractor You'll Ever Need</span>
        </div>

        <h1>
          Quality <span class="accent">Construction</span><br>
          Done Right
        </h1>

        <p class="hero-text">
          Reliable construction, repairs, remodel work, and property improvements for
          homeowners, landlords, realtors, and anyone who needs honest work without
          being overcharged.
        </p>

        <div class="hero-actions">
          <a href="#quote" class="btn"><span>Request Estimate</span></a>
        </div>
      </div>
    </div>

    <div class="slider-dots" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </section>
</body>
</html>
